# Docker Compose setup for the todo CLI.
#
# This is a command-line app, not a server, so nothing stays running.
# Each command starts a container, runs, and exits:
#
#   docker compose build                 # build the image (after code changes too)
#   docker compose run --rm todo list    # run a command
#   docker compose run --rm todo add Go gym -p high
#
# Everything after the service name ("todo") is passed to the app.

services:
  todo:
    # Build from the Dockerfile in this folder and tag the result, so plain
    # `docker run ... rust-todo` uses the same image.
    build: .
    image: rust-todo

    # Must match the Dockerfile; this is what decides "today" and "overdue".
    environment:
      TZ: Europe/London

    # The database lives in a named volume, so tasks survive between runs,
    # rebuilds and `docker compose down`.
    volumes:
      - todo-data:/data

# Named volumes declared here are created on first use.
# `name:` fixes the real volume name to todo-data. Without it Compose would
# prefix it with the project name (rust_todo_list_todo-data), and it would
# no longer be the same volume as the `docker run -v todo-data:/data` commands.
volumes:
  todo-data:
    name: todo-data
